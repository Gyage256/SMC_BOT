name: bot
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bot
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python smc_bot.py --once
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add state.json bot.log *.html
          git commit -m update || exit 0
          git push
